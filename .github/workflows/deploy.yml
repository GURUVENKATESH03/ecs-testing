name: Deploy to Amazon ECR

on:
  push:
    branches:
      - main  # Triggers the pipeline every time you push code to the main branch

env:
  AWS_REGION: ap-south-1                   # Change to your AWS region
  ECR_REPOSITORY: ecs-testing             # Your Amazon ECR repository name

jobs:
  deploy:
    name: Build and Push Image
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout your repository code onto the runner
    - name: Checkout Code
      uses: actions/checkout@v4

    # Step 2: Configure AWS credentials using your GitHub Secrets
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    # Step 3: Log in to Amazon ECR
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    # Step 4: Build, tag, and push the image to Amazon ECR
    - name: Build, Tag, and Push Image to ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: latest
      run: |
        # Build the docker container
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        
        # Push it to AWS ECR
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
